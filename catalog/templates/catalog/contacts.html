{% extends 'catalog/base_template.html' %}

{% block title %}Наши контакты{% endblock %}

{% block content %}

<div class="container">
    <div class="row text-start">
        <div class="col-lg-9 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <table class="table table-striped">
                        <tr>
                            <td class="w-25">Страна</td>
                            <td>Российская федерация</td>
                        </tr>
                        <tr>
                            <td class="w-25">ИНН</td>
                            <td>111111111111</td>
                        </tr>
                        <tr>
                            <td class="w-25">Адрес</td>
                            <td>Московская обл., г. Химки, Проспект мира, 1</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Свяжитесь с нами</h4>
                </div>
                <div class="card-body">
                    <form action="" class="form-floating" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name">Имя</label>
                            <input class="form-control" id="name" name="name" placeholder="Ваше имя" required
                                   type="text">
                        </div>
                        <div class="mb-3">
                            <label for="phone">Телефон</label>
                            <input class="form-control" id="phone" name="phone" placeholder="Контактный телефон"
                                   required type="text">
                        </div>
                        <div class="mb-3">
                            <label for="message">Сообщение</label>
                            <textarea class="form-control" id="message" name="message" placeholder="Ваше сообщение"
                                      required type="text"></textarea>
                        </div>
                        <button class="btn btn-lg btn-block btn-outline-primary" type="submit">Отправить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
