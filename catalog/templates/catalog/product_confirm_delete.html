{% extends 'catalog/base_template.html' %}
{% load my_tags %}
{% block title %}Удаление продукта{% endblock %}

{% block content %}

<div class="container mt-5">
    <h1 class="mb-4">Удалить продукт</h1>
    <p>Вы уверены, что хотите удалить "{{ product.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Удалить</button>
        <a class="btn btn-secondary" href="{% url 'catalog:product_list' %}">Отмена</a>
    </form>
</div>

{% endblock %}
